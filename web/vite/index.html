<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link
			rel="icon"
			type="image/png"
			href="/favicon.png" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<title>Pomodoro</title>
		<!-- apply saved theme before first paint to avoid a white flash -->
		<script>
			(function () {
				var t = localStorage.getItem("theme") || "system";
				var dark =
					t === "dark" ||
					(t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.classList.toggle("dark", dark);
				// paint instantly with the matching --background token (see globals.css)
				document.documentElement.style.backgroundColor = dark
					? "oklch(16.886% 0.00208 286.046)"
					: "oklch(0.994 0 0)";
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script
			type="module"
			src="/src/main.tsx"></script>
	</body>
</html>
